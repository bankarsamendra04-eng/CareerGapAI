[tool.poetry]
name = "careergap-ai"
version = "1.0.0"
description = "Gemini-powered career gap analysis application"
authors = ["CareerGap AI"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
fastapi = "0.116.1"
google-genai = "1.31.0"
pydantic = "2.11.7"
pypdf = "6.0.0"
python-docx = "1.2.0"
python-multipart = "0.0.20"
uvicorn = { version = "0.35.0", extras = ["standard"] }

[build-system]
requires = ["poetry-core>=1.8"]
build-backend = "poetry.core.masonry.api"
