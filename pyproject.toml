[project]
name = "careergap-ai"
version = "1.0.0"
description = "Gemini-powered career gap analysis application"
requires-python = ">=3.10"
dependencies = [
  "fastapi==0.116.1",
  "google-genai==1.31.0",
  "pydantic==2.11.7",
  "pypdf==6.0.0",
  "python-docx==1.2.0",
  "python-multipart==0.0.20",
  "uvicorn[standard]==0.35.0",
]

[build-system]
requires = ["setuptools>=68", "wheel>=0.42"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "backend"]

[tool.uvicorn]
factory = false
